services:
  URLSHORTNERDB:
    image: postgres:16
    restart: always
    environment:
      POSTGRES_USER: ${DB_USERNAME}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: ${DB_NAME}
    ports:
      - "${DB_PORT}:5432"
    volumes:
      - URLSHORTNERDB:/var/lib/postgresql/data

volumes:
  URLSHORTNERDB:
